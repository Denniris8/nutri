server {
    listen 80;
    server_name genos.taile91252.ts.net;

    return 308 https://genos.taile91252.ts.net$request_uri;
}

server {
    listen 8081;
    server_name genos.taile91252.ts.net;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        set $nutri_upstream nutri:8080;
        proxy_pass http://$nutri_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        # El modelo admite 600 s por intento y puede reintentar validaciones.
        proxy_read_timeout 1900s;
        proxy_send_timeout 660s;
    }
}
