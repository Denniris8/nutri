services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  nutri:
    build: .
    image: nutricion-app:local
    restart: unless-stopped
    working_dir: /app
    command: sh -c "sh mysql/migrate.sh && node html/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 8080
      HOST: 0.0.0.0
      OPENCODE_BASE_URL: http://host.docker.internal:49375
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Define OPENCODE_SERVER_PASSWORD en .env}
      OPENCODE_AUTO_START: "false"
    volumes:
      - .:/app:ro
      - ../garmin-connect-mcp:/app/garmin-connect-mcp:ro
    extra_hosts:
      - "host.docker.internal:172.21.0.1"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      opencode:
        condition: service_healthy

  opencode:
    build: ./docker/opencode
    image: nutri-opencode:2.1.3
    restart: unless-stopped
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Define OPENCODE_SERVER_PASSWORD en .env}
    ports:
      - "127.0.0.1:49375:4096"
    volumes:
      - opencode_config:/home/opencode/.config/opencode
      - opencode_data:/home/opencode/.local/share/opencode
      - opencode_state:/home/opencode/.local/state/opencode
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    networks: [opencode_egress]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/global/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mysql_data:
  opencode_config:
  opencode_data:
  opencode_state:

networks:
  opencode_egress:
