services:
  mysql:
    image: mysql:${MYSQL_IMAGE_VERSION:-9.7}
    restart: unless-stopped
    networks: [database]
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME en .env}
      MYSQL_USER: ${DB_USER:?Define DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - /home/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  nutri:
    build: .
    image: nutricion-app:local
    restart: unless-stopped
    working_dir: /app
    command: sh -c "sh mysql/migrate.sh && node html/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 8080
      HOST: 0.0.0.0
      NODE_ENV: production
      OPENCODE_BASE_URL: http://opencode:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Define OPENCODE_SERVER_PASSWORD en .env}
      OPENCODE_AUTO_START: "false"
    volumes:
      - .:/app:ro
      - ../garmin-connect-mcp:/app/garmin-connect-mcp:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, database]
    depends_on:
      mysql:
        condition: service_healthy
      opencode:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "100.97.84.121:80:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nutri:
        condition: service_healthy

  opencode:
    build: ./docker/opencode
    image: nutri-opencode:2.2.5
    restart: unless-stopped
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Define OPENCODE_SERVER_PASSWORD en .env}
    ports:
      - "127.0.0.1:49375:4096"
    volumes:
      - opencode_config:/home/opencode/.config/opencode
      - opencode_data:/home/opencode/.local/share/opencode
      - opencode_state:/home/opencode/.local/state/opencode
    pids_limit: 64
    cap_drop: [ALL]
    networks: [default, opencode_egress]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/global/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  opencode_config:
  opencode_data:
  opencode_state:

networks:
  database:
    internal: true
  opencode_egress:
