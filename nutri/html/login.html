<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pwa-icon-192.png">
  <link rel="stylesheet" href="/notifications.css">
  <title>Acceso · Dashboard Nutricional</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #000; color: #f5f5f7; --surface: #111; --surface-raised: #2a2a2c; --ink-muted: #c7c7cc; --line: #48484a; --blue: #2997ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 40px 28px; display: grid; place-items: center; background: #000; }
    main { width: min(100%, 1000px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); align-items: center; gap: clamp(40px, 8vw, 120px); }
    .login-intro { max-width: 430px; }
    .brand { margin: 0 0 64px; color: #f5f5f7; font-size: 22px; font-weight: 650; letter-spacing: -.06em; }
    .brand span { color: var(--blue); }
    h1 { max-width: 9ch; margin: 0; font-size: clamp(42px, 5vw, 68px); line-height: .98; letter-spacing: -.055em; text-wrap: balance; }
    .login-intro > p { max-width: 34ch; margin: 20px 0 0; color: var(--ink-muted); font-size: 17px; line-height: 1.55; }
    .auth-panel { padding: 28px; border-radius: 16px; background: var(--surface); }
    .auth-panel > p { margin: 0 0 20px; color: var(--ink-muted); }
    label { display: block; margin: 16px 0 7px; color: #f5f5f7; font-size: 14px; font-weight: 550; }
    input, select, button { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 8px; font: inherit; }
    input, select { border: 1px solid var(--line); color: inherit; background: #000; }
    button { margin-top: 16px; border: 0; background: #f5f5f7; color: #000; font-weight: 650; cursor: pointer; transition: background-color 140ms ease, transform 100ms ease; }
    button:hover { background: #d9d9de; }
    button:active { transform: scale(.99); }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    .mode-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 22px; padding: 4px; border-radius: 9px; background: #000; }
    .mode-buttons button { min-height: 40px; margin: 0; padding: 8px; border-radius: 6px; background: transparent; color: var(--ink-muted); font-size: 14px; }
    .mode-buttons button[aria-pressed="true"] { background: var(--surface-raised); color: #fff; }
    .button-cancel { margin-top: 8px; background: var(--surface-raised); color: #fff; }
    .button-cancel:hover { background: #38383a; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }
    [role="alert"] { min-height: 1.5em; margin-bottom: 0; color: #ff6961; }
    .skip-link { position: fixed; z-index: 1000; top: 8px; left: 8px; padding: 10px 14px; transform: translateY(-160%); background: #f5f5f7; color: #000; }
    .skip-link:focus { transform: translateY(0); }
    @media (max-width: 700px) {
      body { display: block; padding: 28px 16px; }
      main { width: min(100%, 480px); margin: 0 auto; grid-template-columns: 1fr; gap: 28px; }
      .login-intro { padding: 0 4px; }
      .brand { margin-bottom: 34px; }
      h1 { max-width: 12ch; font-size: clamp(38px, 10vw, 52px); }
      .login-intro > p { margin-top: 12px; font-size: 15px; }
      .auth-panel { padding: 22px 18px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">Saltar al contenido</a>
  <main id="mainContent" tabindex="-1">
    <section class="login-intro" aria-labelledby="loginTitle">
      <p class="brand" translate="no">Nutri<span>.</span></p>
      <h1 id="loginTitle">Nutrición con contexto.</h1>
      <p>Registra alimentación y actividad. Revisa tus objetivos y tendencias desde un solo lugar.</p>
    </section>
    <section class="auth-panel" aria-label="Acceso a tu cuenta">
    <p>Inicia sesión o crea tu perfil para continuar.</p>
    <div class="mode-buttons" role="group" aria-label="Acceso a la cuenta">
      <button type="button" data-mode="login" aria-pressed="true">Iniciar sesión</button>
      <button type="button" data-mode="register" aria-pressed="false">Registrarme</button>
    </div>
    <form id="loginForm">
      <label for="loginEmail">Correo electrónico</label>
      <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <label for="loginPassword">Contraseña</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <button id="resendVerificationButton" type="button" class="button-cancel">Reenviar verificación de correo</button>
    </form>
    <form id="registerForm" hidden>
      <label for="registerName">Nombre</label>
      <input id="registerName" name="name" autocomplete="name" maxlength="150" required>
      <input id="registerTimezone" name="timezone" type="hidden">
      <label for="registerCountryCode">País</label>
      <select id="registerCountryCode" name="country" required>
        <option value="">Selecciona tu país…</option>
        <option value="AR" data-dial-code="+54">Argentina (+54)</option>
        <option value="AU" data-dial-code="+61">Australia (+61)</option>
        <option value="BO" data-dial-code="+591">Bolivia (+591)</option>
        <option value="BR" data-dial-code="+55">Brasil (+55)</option>
        <option value="CA" data-dial-code="+1">Canadá (+1)</option>
        <option value="CL" data-dial-code="+56">Chile (+56)</option>
        <option value="CN" data-dial-code="+86">China (+86)</option>
        <option value="CO" data-dial-code="+57">Colombia (+57)</option>
        <option value="CR" data-dial-code="+506">Costa Rica (+506)</option>
        <option value="CU" data-dial-code="+53">Cuba (+53)</option>
        <option value="EC" data-dial-code="+593">Ecuador (+593)</option>
        <option value="SV" data-dial-code="+503">El Salvador (+503)</option>
        <option value="ES" data-dial-code="+34">España (+34)</option>
        <option value="US" data-dial-code="+1">Estados Unidos (+1)</option>
        <option value="PH" data-dial-code="+63">Filipinas (+63)</option>
        <option value="FR" data-dial-code="+33">Francia (+33)</option>
        <option value="DE" data-dial-code="+49">Alemania (+49)</option>
        <option value="GT" data-dial-code="+502">Guatemala (+502)</option>
        <option value="HN" data-dial-code="+504">Honduras (+504)</option>
        <option value="IN" data-dial-code="+91">India (+91)</option>
        <option value="IT" data-dial-code="+39">Italia (+39)</option>
        <option value="JP" data-dial-code="+81">Japón (+81)</option>
        <option value="MX" data-dial-code="+52">México (+52)</option>
        <option value="NI" data-dial-code="+505">Nicaragua (+505)</option>
        <option value="PA" data-dial-code="+507">Panamá (+507)</option>
        <option value="PY" data-dial-code="+595">Paraguay (+595)</option>
        <option value="PE" data-dial-code="+51">Perú (+51)</option>
        <option value="PT" data-dial-code="+351">Portugal (+351)</option>
        <option value="PR" data-dial-code="+1">Puerto Rico (+1)</option>
        <option value="GB" data-dial-code="+44">Reino Unido (+44)</option>
        <option value="DO" data-dial-code="+1">República Dominicana (+1)</option>
        <option value="UY" data-dial-code="+598">Uruguay (+598)</option>
        <option value="VE" data-dial-code="+58">Venezuela (+58)</option>
      </select>
      <label for="registerEmail">Correo electrónico</label>
      <input id="registerEmail" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <label for="registerCelular">Teléfono</label>
      <input id="registerCelular" name="celular" type="tel" autocomplete="tel-national" placeholder="81 1234 5678">
      <label for="registerPassword">Contraseña (mínimo 12 caracteres)</label>
      <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      <label for="registerAge">Edad</label>
      <input id="registerAge" name="age" type="number" min="13" max="120" step="1" required>
      <label for="registerHeight">Estatura medida (cm)</label>
      <input id="registerHeight" name="heightCm" type="number" min="80" max="250" step="0.1" inputmode="decimal" required>
      <label for="registerSex">Sexo</label>
      <select id="registerSex" name="sex" required>
        <option value="">Selecciona…</option>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>
      <button type="submit">Crear cuenta y perfil</button>
      <button id="cancelRegister" type="button" class="button-cancel">Cancelar</button>
    </form>
    <p id="errorMessage" role="alert" aria-live="polite"></p>
    </section>
  </main>
  <div id="appNoticeDialog" class="app-notice" popover="manual"><div class="app-notice-row"><p id="appNoticeText" role="status" aria-live="polite"></p><button id="appNoticeClose" type="button" aria-label="Cerrar aviso">×</button></div></div>
  <script src="/pwa-register.js" defer></script>
  <script src="/onboarding-flow.js?v=login-email-verify-v4" defer></script>
</body>
</html>
