# Tunel publico gratuito para el Dashboard Nutricional - app/tunnel
# Se levanta con:  sudo docker compose up -d --build
#
# - Usa red host para alcanzar el dashboard, limitado a 127.0.0.1:8080.
# - El token del bot viene de ../grammy/.env (se reutiliza) y los IDs de
#   notificacion estan en ./.env (NOTIFY_CHAT_IDS).
# - El monitor conserva la URL con HTTP 200; ante otro estado o error de red,
#   termina cloudflared y restart: always genera y notifica una URL nueva.
# - Un timer externo que fuerce el reinicio también rotará la URL, sin importar
#   el HTTP status. No está definido ni administrado desde esta carpeta.

services:
  tunnel:
    build: .
    container_name: nutricion-tunnel
    restart: always
    env_file:
      - ../../app/tunnel/.env
      - ../../app/grammy/.env
    network_mode: host
    environment:
      TUNNEL_TARGET: http://127.0.0.1:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
