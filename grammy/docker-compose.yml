# Bot de Telegram (grammY) ⇄ puente directo con OpenCode - app/grammy
# Se levanta con:  sudo docker compose up -d --build
#
# - network_mode: host   → el bot alcanza el servicio OpenCode en 127.0.0.1
#                          (el servicio solo escucha en localhost) y sale a
#                          internet hacia la API de Telegram.
# - volumen /opencode-state (solo lectura) → registro del servicio OpenCode
#   (~/.local/state/opencode/service.json) con URL y password vigentes; el bot
#   lo relee si el servicio reinicia y cambia de puerto.
# - volumen ./data → persiste el mapa chat→sesión entre reinicios.
# - restart: always → arranca solo cada vez que inicia la Raspberry.

services:
  grammy-bot:
    build: .
    container_name: nutricion-grammy-bot
    restart: always
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=America/Monterrey
    volumes:
      - /home/pcp/.local/state/opencode:/opencode-state:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
